function zoomTL(k){pps=clamp(pps*k,20,400);drawTL()}
async function unzipAm(buf){const u8=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}if(e<0)throw new Error('zip');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const list=[];for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);list.push({name:new TextDecoder().decode(u8.subarray(p+46,p+46+nl)),meth:dv.getUint16(p+10,true),csz:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)});p+=46+nl+xl+cl}
return{list,async read(en){const lo=en.off,st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u8.subarray(st,st+en.csz);if(en.meth===0)return raw;const r=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(r).arrayBuffer())}}}
const MIMEX={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac'};
const bname=q=>{let b=String(q||'').split('?')[0].split('/').pop();try{b=decodeURIComponent(b)}catch(e){}return b.toLowerCase()};
async function fillSlots(files){let n=0;for(const s of Object.values(SL)){if(s.url)continue;const b=bname(s.uri),b2=bname(s.fn),f=files.find(f=>{const n=f.name.toLowerCase();return n===b||(b2&&n===b2)});if(f){await setSlotFile(s,f);n++}}return n}
async function openXMLFiles(fs,app){let imp=false;const media=[];
for(const f of fs){const h=new Uint8Array(await f.slice(0,4).arrayBuffer());
if(h[0]===0x50&&h[1]===0x4B){try{const z=await unzipAm(await f.arrayBuffer());let xml=null;for(const en of z.list){if(en.name.endsWith('/'))continue;const ext=en.name.split('.').pop().toLowerCase(),data=await z.read(en);if(!xml&&!MIMEX[ext]&&data.length<5e6){const t=new TextDecoder().decode(data);if(t.includes('<scene')){xml=t;continue}}if(MIMEX[ext])media.push(new File([data],en.name.split('/').pop(),{type:MIMEX[ext]}))}
if(xml){importXML(xml,app);imp=true}else toast('В архиве нет проекта Alight (<scene>)')}catch(e){toast('Не удалось открыть архив')}}
else if(/^(image|video|audio)\//.test(f.type))media.push(f);
else{importXML(await f.text(),app);imp=true}}
if(imp&&media.length){const n=await fillSlots(media);render();refreshSheet();if(n)toast('Медиа назначено автоматически: '+n)}}
function openXML(app){pick('.xml,.alightmotion,.zip,text/xml,application/xml,text/plain,application/zip,image/*,video/*,audio/*',true,fs=>openXMLFiles(fs,app))}
async function pasteXML(){try{importXML(await navigator.clipboard.readText(),1)}catch(e){toast('Буфер недоступний — вставте XML у вкладці XML')}}
async function saveBlob(b,name){const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem){try{const data=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});const w=await C.Plugins.Filesystem.writeFile({path:name,data,directory:'CACHE'});if(C.Plugins.Share)await C.Plugins.Share.share({title:name,url:w.uri});else toast('Збережено: '+w.uri);return}catch(e){toast('Помилка збереження: '+(e.message||e))}}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

function anim(kind,out){const l=L();if(!l||l.type==='audio'){toast('Виберіть кліп');return}const d=Math.min(.6,l.dur/2),e='cubicBezier 0 0 0.58 1';
const A={fade:{op:[0,1]},zoom:{sx:[.5,1],sy:[.5,1],op:[0,1]},pop:{sx:[0,1],sy:[0,1]},slide:{y:[PH*.12,0],op:[0,1]},spin:{rot:[-90,0],op:[0,1]},swipe:{x:[PW*.5,0],op:[0,1]},punch:{sx:[1.4,1],sy:[1.4,1],op:[0,1]}}[kind];
for(const p in A){let a=A[p][0],b=A[p][1];if(out){const q=a;a=b;b=q}const m=p==='op'||p==='sx'||p==='sy',b0=l[p],f=x=>m?b0*x:b0+x;
const nk=out?[{t:l.dur-d,v:f(a),e},{t:l.dur,v:f(b),e}]:[{t:0,v:f(a),e},{t:d,v:f(b),e}];
l.kf[p]=[...(l.kf[p]||[]).filter(k=>out?k.t<l.dur-d-.01:k.t>d+.01),...nk].sort((x,y)=>x.t-y.t)}

const nc=document.createElement('canvas');
const rmp=fn=>{const im=tc.getImageData(0,0,FW,FH),o=new Uint32Array(im.data.buffer.slice(0)),d=new Uint32Array(im.data.buffer);for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){const q=fn(x/FW-.5,y/FH-.5),sx=((q[0]+.5)*FW)|0,sy=((q[1]+.5)*FH)|0;d[y*FW+x]=sx>=0&&sx<FW&&sy>=0&&sy<FH?o[sy*FW+sx]:0}tc.putImageData(im,0,0)};
F('bulge,polar',v=>rmp((x,y)=>{const r=Math.hypot(x,y)*2;if(r>=1||!r)return[x,y];const k=Math.pow(r,1+v*1.2)/r;return[x*k,y*k]}));
F('twirl',v=>rmp((x,y)=>{const r=Math.hypot(x,y)*2,a=Math.max(0,1-r)*v*7,co=Math.cos(a),si=Math.sin(a);return[x*co-y*si,x*si+y*co]}));
F('kaleido',(v,c,t)=>{const n=4+Math.round(v*6),w=6.2832/n;rmp((x,y)=>{const r=Math.hypot(x,y);let a=Math.atan2(y,x)+t*.3;a=Math.abs(((a%w)+w)%w-w/2);return[r*Math.cos(a),r*Math.sin(a)]})});
const WV={mesh_warp:[6,.08,1],liquify:[4,.12,2],turb_disp:[14,.05,4],wave_disp:[10,.06,3],disp_map:[20,.04,0],color_disp:[9,.05,2],glass:[40,.015,0],stripes_warp:[30,.05,2],fractal_edge:[25,.03,5],bend:[3,.2,0],cube:[2,.15,1]};
for(const k in WV){const[f,a,sp]=WV[k];FX[k]=(v,c,t)=>rmp((x,y)=>[x+Math.sin(y*f+t*sp)*a*v*2,y+Math.sin(x*f+t*sp)*a*v*2])}
F('inner_glow,inner_shadow',(v,c)=>{tc.globalCompositeOperation='source-atop';const g=tc.createRadialGradient(FW/2,FH/2,Math.min(FW,FH)*.3,FW/2,FH/2,Math.max(FW,FH)*.65);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,c||'#000');tc.globalAlpha=v;tc.fillStyle=g;tc.fillRect(0,0,FW,FH);tc.globalAlpha=1});
F('stroke,strokes,offset_stroke,dir_stroke,3d_outline',(v,c)=>{const r=Math.max(1,v*14*S());uc.clearRect(0,0,FW,FH);for(let i=0;i<12;i++){const a=i*.5236;uc.drawImage(cT,Math.cos(a)*r,Math.sin(a)*r)}uc.globalCompositeOperation='source-in';uc.fillStyle=c||'#ff4d8d';uc.fillRect(0,0,FW,FH);uc.globalCompositeOperation='source-over';uc.drawImage(cT,0,0);cp()});

function noiseFx(fire){return(v,c,t)=>{const w=48,h=Math.max(8,Math.round(w*FH/FW));nc.width=w;nc.height=h;const g=nc.getContext('2d'),im=g.createImageData(w,h),d=im.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let n=(Math.sin(x*.5+t*2)+Math.sin(y*.4-t*3+x*.1)+Math.sin((x+y)*.3+t)+Math.sin(Math.hypot(x-24,y-12)*.5-t*2))/8+.5;if(fire)n*=Math.pow(y/h,1.5)*1.4;n=clamp(n,0,1);const i=(y*w+x)*4;d[i]=fire?255:255*n;d[i+1]=fire?200*n:255*n;d[i+2]=fire?40*n:255*n;d[i+3]=255*n*(fire?1:.7)}g.putImageData(im,0,0);tc.globalCompositeOperation='lighter';tc.globalAlpha=clamp(v*1.4,0,1);tc.drawImage(nc,0,0,FW,FH);tc.globalAlpha=1}}

async function revAudio(l,s,prev){

    const al=mk('audio',{name:s.name+' ↺',mu:uri,start:l.start,dur:l.dur,vol:l.vol||1,off:0,speed:1});

async function revClip(){
  const l=L();
  if(!l||l.type!=='video'){toast('Реверс — тільки для відео');return}
  if(l.rev){l.mu=l.revPrev.mu;l.off=l.revPrev.off;l.speed=l.revPrev.speed;if(l.revAudio!=null){layers=layers.filter(q=>q.id!==l.revAudio);l.revAudio=null}delete l.rev;delete l.revPrev;delete l._el;commit();drawTL();render();refreshSheet();toast('Реверс прибрано');return}
  const s=SL[l.mu];if(!s||!s.url){toast('Спочатку призначте медіа-файл');return}
  if(!window.MediaRecorder){toast('Реверс не підтримується цим WebView');return}
  pause();
  const FB=30,src=document.createElement('video');src.muted=true;src.preload='auto';src.playsInline=true;src.src=s.url;
  await new Promise((res,rej)=>{src.onloadedmetadata=res;src.onerror=()=>rej(new Error('load'))});
  const sp=l.speed||1,a=l.off,b=Math.min(src.duration||1e9,l.off+l.dur*sp),N=Math.max(2,Math.round(l.dur*FB));
  const k=Math.min(1,1080/Math.max(src.videoWidth,src.videoHeight));
  const w=Math.round(src.videoWidth*k/2)*2,h=Math.round(src.videoHeight*k/2)*2;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const stream=c.captureStream(0),track=stream.getVideoTracks()[0];
  const mime=pickMime(),bps=PREF.bitrate*1e6;
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r);
  rec.start();toast('Реверс: 0%');
  const t0=performance.now();
  for(let i=0;i<N;i++){
    // frame i of the reversed clip shows source time counting down from the end
    const ts=Math.max(a,Math.min(b-.02,b-(i+.5)*(b-a)/N));
    await seekVid(src,ts);
    g.drawImage(src,0,0,w,h);
    track.requestFrame();
    const wait=t0+(i+1)*1000/FB-performance.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));
    if(i%10===0)toast('Реверс: '+Math.round(i/N*100)+'%');
  }
  rec.stop();await stopped;
  const blob=new Blob(chunks,{type:mime||'video/webm'});
  const uri='rev:'+(uid++)+'/'+s.name;
  slot(uri,{type:'video',name:s.name+' ↺',url:URL.createObjectURL(blob),blob,sv:0,w,h,dur:N/FB,th:null,img:null});
  l.revPrev={mu:l.mu,off:l.off,speed:l.speed};
  l.mu=uri;l.off=0;l.speed=1;l.rev=true;delete l._el;
  const oldS=SL[l.revPrev.mu];
  l.revAudio=(oldS&&oldS.blob)?await revAudio(l,oldS,l.revPrev):null;
  if(l.revAudio!=null)l.off=0;
  commit();drawTL();render();refreshSheet();toast('Реверс готов');
}
